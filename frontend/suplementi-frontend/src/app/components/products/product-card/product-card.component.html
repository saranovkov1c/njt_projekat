<div class="card">
  <div class="card-image">
    <img [src]="product.imageUrl || 'https://placehold.co/500x500/E4DFD3/6B675F?text=Suplement'" [alt]="product.name">
    <span class="form-badge">{{ product.form }}</span>
  </div>
  <div class="card-body">
    <span class="cat">{{ product.category?.name }}</span>
    <h4>{{ product.name }}</h4>
    <p class="desc">{{ product.description }}</p>
    <div class="footer">
      <span class="price">{{ product.price | number:'1.0-0' }} RSD</span>
      <span class="stock" [class.low]="product.stock < 10">
        {{ product.stock > 0 ? product.stock + ' kom' : 'Nema' }}
      </span>
    </div>

    <!-- KLIJENT: dodaj u korpu -->
    <button
      class="btn-cart"
      *ngIf="clientService.getUserStatus() === 'user' && product.stock > 0"
      (click)="addToCart()">
      Dodaj u korpu
    </button>

    <!-- ADMIN: izmeni / obriši -->
    <div class="admin-actions" *ngIf="userService.getUserStatus() === 'admin'">
      <button class="btn-edit" (click)="update()">Izmeni</button>
      <button class="btn-delete" (click)="delete()">Obriši</button>
    </div>
  </div>

  <app-product-update-modal
    *ngIf="edit"
    [product]="product"
    (saveProduct)="onSave($event)"
    (closeModal)="edit = false">
  </app-product-update-modal>
</div>
