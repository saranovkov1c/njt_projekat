<div class="modal-overlay" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h3>Izmeni proizvod</h3>
    <form [formGroup]="updateForm" (ngSubmit)="save()">
      <div class="form-group">
        <label>Naziv</label>
        <input type="text" formControlName="name">
      </div>
      <div class="form-group">
        <label>Opis</label>
        <input type="text" formControlName="description">
      </div>
      <div class="form-group">
        <label>Cena (RSD)</label>
        <input type="number" formControlName="price">
      </div>
      <div class="form-group">
        <label>Zaliha</label>
        <input type="number" formControlName="stock">
      </div>
      <div class="form-group">
        <label>Oblik</label>
        <select formControlName="form">
          <option *ngFor="let f of forms" [value]="f">{{ f }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Kategorija</label>
        <select formControlName="categoryId">
          <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>URL slike</label>
        <input type="text" formControlName="imageUrl">
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-primary">Sačuvaj</button>
        <button type="button" class="btn-ghost" (click)="close()">Otkaži</button>
      </div>
    </form>
  </div>
</div>
