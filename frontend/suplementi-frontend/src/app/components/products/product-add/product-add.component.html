<div class="form-container">
  <div class="form-card">
    <h2>Novi proizvod</h2>
    <form [formGroup]="productForm" (ngSubmit)="save()">      
      <div class="form-group">
        <label>Naziv</label>
        <input type="text" formControlName="name">
      </div>
      <div class="form-group">
        <label>Opis</label>
        <input type="text" formControlName="description">
      </div>
      <div class="form-group">
        <label>Cena (RSD)</label>
        <input type="number" formControlName="price">
      </div>
      <div class="form-group">
        <label>Zaliha</label>
        <input type="number" formControlName="stock">
      </div>
      <div class="form-group">
        <label>Oblik</label>
        <select formControlName="form">
          <option *ngFor="let f of forms" [value]="f">{{ f }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Kategorija</label>
        <select formControlName="categoryId">
          <option value="" disabled>Izaberi kategoriju</option>
          <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>URL slike</label>
        <input type="text" formControlName="imageUrl" placeholder="https://...">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">Sačuvaj</button>
        <a routerLink="/products"><button type="button" class="btn-ghost">Otkaži</button></a>
      </div>
    </form>
  </div>
</div>
