<div class="auth-container">
  <div class="auth-card">
    <h2>Prijava</h2>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="form-group">
        <label>Korisničko ime</label>
        <input type="text" formControlName="username" placeholder="Unesite korisničko ime">
      </div>
      <div class="form-group">
        <label>Lozinka</label>
        <input type="password" formControlName="password" placeholder="Unesite lozinku">
      </div>
      <button type="submit" class="btn-primary">Uloguj se</button>
    </form>
    <p class="auth-switch">Nemate nalog? <a routerLink="/register">Registrujte se</a></p>
  </div>
</div>
